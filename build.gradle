import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'java'
    id "com.gradleup.shadow" version "8.3.0"
}

group = 'com.gmail.necnionch.myplugin.combakme'
version = '1.0.0'

repositories {
    mavenCentral()
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }

    maven {  // DiscordSRV
        url = "https://nexus.scarsz.me/content/groups/public/"
    }

    maven {  // JDA
        url = "https://m2.dv8tion.net/releases"
    }

    maven {  // Vault
        url = 'https://jitpack.io'
    }

    maven {  // PlaceholderAPI
        url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
    }
}

dependencies {
    compileOnly "org.jetbrains:annotations:24.0.0"
    compileOnly "org.spigotmc:spigot-api:1.13.2-R0.1-SNAPSHOT"
    compileOnly "com.discordsrv:discordsrv:1.29.0"
    implementation "com.zaxxer:HikariCP:4.0.3" exclude group: "org.slf4j"
    compileOnly "com.github.MilkBowl:VaultAPI:1.7"
    compileOnly "me.clip:placeholderapi:2.11.6"
}

tasks.named("shadowJar", ShadowJar) {
    archiveClassifier.set("")
    dependencies {
        exclude "/META-INF/**"
    }
    relocate "com.zaxxer.hikari", "${project.group}.libs.hikari"
}

def targetJavaVersion = 8
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
